<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>废物是怎样练成的</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;background:#07070a;color:#b9b9c0;
    font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Noto Serif SC",serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }

  /* ---------- 封面 ---------- */
  #cover{
    position:fixed;inset:0;z-index:30;
    display:flex;align-items:center;justify-content:center;
    background:#07070a;
    transition:opacity 1.4s ease;
  }
  #cover.hide{opacity:0;pointer-events:none;}
  .cover-inner{text-align:center;padding:0 30px;}
  .cover-inner h1{
    font-size:26px;font-weight:400;letter-spacing:10px;
    color:#d6d6dc;margin-bottom:24px;
    animation:fade 2s ease forwards;opacity:0;
  }
  .cover-inner .sub{
    font-size:12px;letter-spacing:6px;color:#8a8a96;margin-bottom:60px;
    animation:fade 2s .4s ease forwards;opacity:0;
  }
  #startBtn{
    background:transparent;border:1px solid #2c2c34;color:#8e8e98;
    font-family:inherit;font-size:14px;letter-spacing:6px;
    padding:14px 46px;cursor:pointer;border-radius:2px;
    transition:all .4s ease;
    animation:fade 2s .9s ease forwards;opacity:0;
  }
  #startBtn:hover{border-color:#8e4040;color:#e2e2e8;background:rgba(142,64,64,.08);}

  /* ---------- 主体 ---------- */
  #app{
    position:fixed;inset:0;max-width:620px;margin:0 auto;
    display:flex;flex-direction:column;padding:0 22px;
  }
  #log{
    flex:1;overflow-y:auto;padding:36px 0 8px;
    scrollbar-width:none;
  }
  #log::-webkit-scrollbar{display:none;}

  #log p{
    font-size:16px;line-height:2;margin-bottom:12px;letter-spacing:.5px;
    opacity:0;animation:fade .9s ease forwards;
  }
  @keyframes fade{to{opacity:1;}}

  .nar{color:#94949d;}
  .said{color:#dcdce2;}
  .prompt{color:#8a8a96;font-size:14px;margin-top:20px;}
  .echo{
    color:#8e4040;font-size:15px;letter-spacing:.8px;
    margin-bottom:10px;
  }
  .echo-tag{
    display:inline-block;font-size:10px;color:#9a9aa6;
    letter-spacing:2px;margin-right:9px;
    vertical-align:1px;
  }
  .final{
    color:#c9c9d0;font-size:19px;letter-spacing:3px;
    text-align:center;margin-top:30px;margin-bottom:24px;
  }

  .chapter{text-align:center;padding:26px 0 34px;opacity:0;animation:fade 1.4s ease forwards;}
  .ch-title{font-size:19px;letter-spacing:7px;color:#d0d0d6;margin-bottom:12px;}
  .ch-sub{font-size:12px;letter-spacing:3px;color:#a8a8b4;}

  .the-end{
    text-align:center;font-size:13px;letter-spacing:8px;color:#6a6a76;
    padding:40px 0 60px;opacity:0;animation:fade 2.4s ease forwards;
  }

  /* ---------- 常规选项 ---------- */
  #choices{flex-shrink:0;padding:10px 0 26px;}
  .choice{
    display:block;width:100%;text-align:left;
    background:transparent;
    border:1px solid #23232b;
    border-left:2px solid #3a3a44;
    color:#a6a6b0;
    font-family:inherit;font-size:15px;line-height:1.8;
    padding:14px 16px;margin-bottom:9px;
    cursor:pointer;border-radius:2px;
    transition:all .28s ease;
    opacity:0;animation:fade .6s ease forwards;
  }
  .choice:hover{
    border-color:#4a4a58;border-left-color:#8e4040;
    color:#ececf2;background:rgba(142,64,64,.07);
    padding-left:22px;
  }
  .choice:active{background:rgba(142,64,64,.14);}

  /* =====================================================
     压抑层：呼吸 / 暗角 / 光标拖尾
     ===================================================== */
  #breath{
    position:fixed;inset:0;pointer-events:none;z-index:12;
    background:radial-gradient(ellipse at center,
      transparent 0%,
      transparent 42%,
      rgba(0,0,0,.55) 100%);
    opacity:0;
    transition:opacity 1.2s ease;
  }
  #breath.on{
    opacity:1;
    animation:breathe 1.15s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ opacity:.45; }
    50%    { opacity:.92; }
  }

  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:14;
    box-shadow: inset 0 0 0 0 transparent;
    transition: box-shadow .7s ease;
  }

  .trail-dot{
    position:fixed;
    width:22px;height:22px;
    margin-left:-11px;margin-top:-11px;
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(0,0,0,.75) 0%,
      rgba(0,0,0,.35) 40%,
      rgba(0,0,0,0) 72%);
    pointer-events:none;
    z-index:14;
    opacity:.42;
    transition:opacity 1.3s ease;
  }

  /* =====================================================
     第五幕 · 阶段一：中央后退 + 随机前进
     ===================================================== */
  #choices.stage{
    position:fixed;inset:0;z-index:15;
    padding:0;margin:0;
    background:transparent;
    pointer-events:none;
    overflow:hidden;
  }

  #choices.stage .choice{
    position:absolute;
    display:block;
    width:auto;
    margin:0;
    border-radius:2px;
    opacity:1;
    animation:none;
    pointer-events:auto;
  }

  /* 中央：后退一步（会被 JS 逐步缩小） */
  #choices.stage .center-back{
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:#a6a6b0;
    border:1px solid #23232b;
    border-left:2px solid #3a3a44;
    z-index:3;
    transition: all .5s cubic-bezier(.4,0,.2,1),
                color .3s ease,
                border-color .3s ease,
                background .3s ease;
  }
  #choices.stage .center-back:hover{
    border-color:#4a4a58;border-left-color:#8e4040;
    color:#ececf2;background:rgba(142,64,64,.07);
  }
  #choices.stage .center-back[disabled]{
    pointer-events:none;
    opacity:.4;
  }

  /* 随机：前进一步（空壳 → 延迟显现文字） */
  #choices.stage .spawn-forward{
    pointer-events:none;
    min-width:108px;
    height:38px;
    padding:0;
    text-align:center;
    font-size:12px;
    line-height:36px;
    letter-spacing:2px;
    color:transparent;
    border:1px solid #3a2222;
    border-left:1px solid #5a3030;
    background:rgba(142,64,64,.05);
    animation:spawnIn .55s ease;
    transition: color .8s ease, background .8s ease;
  }
  #choices.stage .spawn-forward.shown{
    color:#9a5a5a;
    background:rgba(142,64,64,.1);
  }
  @keyframes spawnIn{
    from{opacity:0;transform:scale(.82);}
    to{opacity:1;transform:scale(1);}
  }

  /* =====================================================
     第五幕 · 阶段二：闪回后 · 巨大的前进一步
     ===================================================== */
  #choices.final-stage{
    position:fixed;inset:0;z-index:15;
    padding:0;margin:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(5,5,8,.97);
    pointer-events:auto;
    animation:fade 1.2s ease forwards;
  }

  #choices.final-stage .final-forward{
    position:static;
    display:block;
    width:auto;
    min-width:min(78vw,440px);
    margin:0;
    padding:44px 50px;
    text-align:center;
    font-family:inherit;
    font-size:28px;
    letter-spacing:14px;
    text-indent:14px;
    color:#f0cccc;
    background:rgba(142,64,64,.16);
    border:2px solid #8e4040;
    border-left:2px solid #8e4040;
    border-radius:2px;
    cursor:pointer;
    opacity:1;
    box-shadow:0 0 50px rgba(142,64,64,.3), inset 0 0 40px rgba(142,64,64,.18);
    animation:pulseBig 2.4s ease-in-out infinite;
    transition:color .3s ease, background .3s ease, border-color .3s ease;
  }
  #choices.final-stage .final-forward:hover{
    padding-left:50px;
    color:#fff;
    background:rgba(190,86,86,.34);
    border-color:#c25a5a;
    border-left-color:#c25a5a;
  }
  @keyframes pulseBig{
    0%,100%{box-shadow:0 0 40px rgba(142,64,64,.22), inset 0 0 34px rgba(142,64,64,.14);}
    50%    {box-shadow:0 0 80px rgba(190,80,80,.48), inset 0 0 54px rgba(180,80,80,.3);}
  }

  /* ---------- 闪白层 ---------- */
  #flash{
    position:fixed;inset:0;background:#fff;opacity:0;
    z-index:26;pointer-events:none;
  }

  /* ---------- 淡出黑幕 ---------- */
  #fade{
    position:fixed;inset:0;background:#000;opacity:0;
    pointer-events:none;transition:opacity 1.5s ease;z-index:20;
  }
  #fade.on{opacity:1;pointer-events:all;}
</style>
</head>
<body>

<div id="cover">
  <div class="cover-inner">
    <h1>废物是怎样练成的</h1>
    <div class="sub">文字互动 · 五幕</div>
    <button id="startBtn">开 始</button>
  </div>
</div>

<div id="app">
  <div id="log"></div>
  <div id="choices"></div>
</div>

<div id="breath"></div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="fade"></div>

<!-- ★★★ 背景音乐：把 src 换成你自己的音乐文件路径 ★★★ -->
<audio id="bgm" src="https://cf937.github.io/music/《他们说》.mp3.mp3" loop preload="auto"></audio>

<script>
/* =========================================================
   剧本
   ========================================================= */
const acts = [

/* ---------------- 第一幕 ---------------- */
{
  role: '母亲',
  blocks: [
    { type:'title', text:'第一幕', sub:'家里的废物 · 你现在是母亲' },
    { type:'nar', lines:[
      '晚饭桌。',
      '陈默把最后一口米饭塞进嘴里。',
      '你放下筷子，声音像一把钝刀。'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '张姐的儿子又考了年级前十，保送清华基本定了。你呢？',
      '隔壁张姐的儿子保送清华了，你什么时候能给我长一次脸？'
    ]},
    { type:'nar', lines:[
      '陈默盯着碗底的米粒。',
      '“二百七十三。”他说。',
      '全校一共三百二十人。'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '二百七十三！我怎么就生了你这么个不争气的东西？',
      '三百二十个人里你考二百七十三，你是去学校睡觉的吗？'
    ]},
    { type:'nar', lines:[
      '陈默起身收拾碗筷。',
      '手背不小心碰到你的茶杯。',
      '茶水溅在桌布上，留下褐色的污渍。'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '连个碗都拿不好！滚去学习！',
      '这点事都做不好，你还能干什么？'
    ]},
    { type:'nar', lines:[
      '陈默默默走向自己不到六平米的房间。',
      '书桌上堆满了辅导资料。',
      '最上面那本《高考必刷题》的扉页上，你用红笔写着：',
      '“考不上985，就别叫我妈！”'
    ]}
  ]
},

/* ---------------- 第二幕 ---------------- */
{
  role: '王老师',
  blocks: [
    { type:'title', text:'第二幕', sub:'学校里的废物 · 你现在是班主任王老师' },
    { type:'nar', lines:[
      '讲台上。',
      '你把数学试卷往桌上一拍。',
      '鲜红的“58”刺得人眼睛疼。'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '陈默！站起来！看看你考的这个分数！',
      '五十八分。陈默，你是来上学的还是来混日子的？'
    ]},
    { type:'nar', lines:[
      '陈默浑身一抖，慢慢从座位上站起来。',
      '教室里爆发出一阵哄笑。',
      '后排的刘强吹了个口哨。'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '烂泥扶不上墙！',
      '就你这样的，以后能干什么？扫大街都没人要！'
    ]},
    { type:'nar', lines:[
      '你把试卷揉成一团，扔在他脸上。',
      '纸团砸中他的鼻梁，落在地上。',
      '陈默攥紧了拳头，指甲深深掐进掌心。'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '站着听课！',
      '全班都看看，这就是不努力的下场。'
    ]},
    { type:'nar', lines:[
      '下课铃响，你抱着教案走出教室。',
      '陈默还站在原地。',
      '他昨晚熬到两点，做了整整两套题。',
      '这件事，你永远不会知道。'
    ]}
  ]
},

/* ---------------- 第三幕 ---------------- */
{
  role: '父亲',
  blocks: [
    { type:'title', text:'第三幕', sub:'社会里的废物 · 你现在是父亲' },
    { type:'nar', lines:[
      '晚餐桌。',
      '你连看都没看儿子一眼。',
      '筷子敲在碗沿上，发出清脆的响声。'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '废物。',
      '我怎么就养了你这么个东西。'
    ]},
    { type:'nar', lines:[
      '高考前三个月。',
      '陈默的模拟考试成绩单摊在桌上。',
      '数字红得刺眼。'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '考不上985，你就别回家了。',
      '你要是考个垃圾学校，我的脸往哪搁？'
    ]},
    { type:'nar', lines:[
      '高考结束。',
      '陈默站在你面前，说“不太好”。',
      '你把他的试卷撕成两半。'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '废物就是废物。',
      '早知道这样，不如生下来就掐死你。'
    ]},
    { type:'nar', lines:[
      '碎片像雪花一样落在地上。',
      '陈默蹲下去，一片一片捡起来。',
      '然后他笑了。'
    ]}
  ]
},

/* ---------------- 第四幕 ---------------- */
{
  role: '刘强',
  blocks: [
    { type:'title', text:'第四幕', sub:'人生里的废物 · 你现在是刘强' },
    { type:'nar', lines:[
      '课间。',
      '你把一摞作业本拍在陈默桌上。',
      '本子散开，压住了他正在写的字。'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '废物，帮我们写作业呗。',
      '闲着也是闲着，帮哥几个把作业写了。'
    ]},
    { type:'nar', lines:[
      '陈默抬起头。',
      '“我自己作业还没写完……”'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '哟，学会顶嘴了？信不信我告诉王老师你考试作弊？',
      '你还敢说话？信不信我让你明天来不了学校？'
    ]},
    { type:'nar', lines:[
      '高考录取结果出来那天。',
      '你考上了本省的一本。',
      '你在高中群里艾特了陈默。',
      '他考上了一所普通的二本。'
    ]},
    { type:'ask', prompt:'你要说什么？', choices:[
      '@陈默 废物考哪了？这种学校毕业了能干啥？送外卖吧！',
      '@陈默 哟，废物也有学上啊？'
    ]},
    { type:'nar', lines:[
      '群里其他人跟着起哄。',
      '陈默关掉群聊。',
      '他点开和左声的私聊窗口，打了一行字：',
      '“你说，如果我消失了，会有人发现吗？”',
      '十分钟后，左声回了一句：',
      '“别矫情了，忙着呢。”'
    ]}
  ]
},

/* ---------------- 第五幕 ---------------- */
{
  role: '陈默',
  blocks: [
    { type:'title', text:'第五幕', sub:'废物 · 你现在是陈默' },
    { type:'nar', lines:[
      '你叫陈默。',
      '你十七岁。',
      '你站在十三层楼的天台上。',
      '夕阳把天空染成橙红色，远处的楼房像剪影一样美丽。',
      '风很轻。'
    ]},
    { type:'nar', lines:[
      '你闭上眼睛。',
      '那些声音又来了。',
      '它们从来没有离开过。'
    ]},
    { type:'backStep' }
  ]
}

];

/* =========================================================
   引擎
   ========================================================= */
const logEl      = document.getElementById('log');
const choicesEl  = document.getElementById('choices');
const fadeEl     = document.getElementById('fade');
const flashEl    = document.getElementById('flash');
const vignetteEl = document.getElementById('vignette');
const breathEl   = document.getElementById('breath');
const bgmEl      = document.getElementById('bgm');   // ★ 背景音乐

const state = {
  ai:0, bi:0,
  echoes:[], echoIdx:0,
  pushCount:0,
  trailEnabled:false,
  lastTrailTime:0
};

/* ---------- 工具 ---------- */
function scrollBottom(){
  requestAnimationFrame(function(){
    logEl.scrollTop = logEl.scrollHeight;
    setTimeout(function(){ logEl.scrollTop = logEl.scrollHeight; }, 120);
  });
}

function addP(text, cls){
  const p = document.createElement('p');
  if (cls) p.className = cls;
  p.textContent = text;
  logEl.appendChild(p);
  return p;
}

function addEcho(role, line){
  const p = document.createElement('p');
  p.className = 'echo';
  const s = document.createElement('span');
  s.className = 'echo-tag';
  s.textContent = role;
  p.appendChild(s);
  p.appendChild(document.createTextNode('“' + line + '”'));
  logEl.appendChild(p);
  return p;
}

function showTitle(text, sub){
  const d = document.createElement('div');
  d.className = 'chapter';
  d.innerHTML = '<div class="ch-title">' + text + '</div>' +
                '<div class="ch-sub">' + sub + '</div>';
  logEl.appendChild(d);
  scrollBottom();
}

function showLines(lines, cb){
  let i = 0;
  function tick(){
    if (i >= lines.length){
      if (cb) setTimeout(cb, 400);
      return;
    }
    addP(lines[i], 'nar');
    scrollBottom();
    i++;
    setTimeout(tick, 700);
  }
  tick();
}

function showChoices(b, role){
  addP(b.prompt || '你要说什么？', 'prompt');
  scrollBottom();
  choicesEl.className = '';
  choicesEl.innerHTML = '';
  b.choices.forEach(function(c, idx){
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.style.animationDelay = (idx * 0.12) + 's';
    btn.addEventListener('click', function(){
      choicesEl.innerHTML = '';
      state.echoes.push({ role: role, line: c });
      addP('“' + c + '”', 'said');
      scrollBottom();
      setTimeout(nextBlock, 900);
    });
    choicesEl.appendChild(btn);
  });
}

/* ---------- 幕间分隔 ---------- */
function actTransition(cb){
  fadeEl.style.transition = 'opacity 1.5s ease';
  fadeEl.classList.add('on');

  setTimeout(function(){
    logEl.innerHTML = '';
    choicesEl.className = '';
    choicesEl.innerHTML = '';
    logEl.scrollTop = 0;

    setTimeout(function(){
      fadeEl.classList.remove('on');
      setTimeout(cb, 260);
    }, 240);
  }, 1620);
}

/* ---------- 主循环 ---------- */
function nextBlock(){
  if (state.ai >= acts.length) return;

  const act = acts[state.ai];

  if (state.bi >= act.blocks.length){
    state.ai++;
    state.bi = 0;
    if (state.ai < acts.length){
      actTransition(nextBlock);
    }
    return;
  }

  const b = act.blocks[state.bi];
  state.bi++;

  switch (b.type){
    case 'title':
      showTitle(b.text, b.sub);
      setTimeout(nextBlock, 2000);
      break;
    case 'nar':
      showLines(b.lines, nextBlock);
      break;
    case 'ask':
      showChoices(b, act.role);
      break;
    case 'backStep':
      renderBackButton();
      break;
  }
}

/* =========================================================
   第五幕 · 循环一：回声阶段
   ========================================================= */
function renderBackButton(){
  choicesEl.className = '';
  choicesEl.innerHTML = '';

  const btn = document.createElement('button');
  btn.className = 'choice';
  btn.textContent = '后退一步';
  btn.style.animationDelay = '0s';
  btn.addEventListener('click', onBackClick);
  choicesEl.appendChild(btn);
  scrollBottom();
}

function onBackClick(){
  choicesEl.innerHTML = '';

  addP('你试着往后挪了半步。', 'nar');
  scrollBottom();

  setTimeout(function(){
    addP('身后没有路。', 'nar');
    scrollBottom();

    setTimeout(function(){
      if (state.echoIdx < state.echoes.length){
        const e = state.echoes[state.echoIdx];
        addEcho(e.role, e.line);
        state.echoIdx++;
        scrollBottom();

        setTimeout(function(){
          if (state.echoIdx < state.echoes.length){
            renderBackButton();
          } else {
            afterAllEchoes();
          }
        }, 1150);
      } else {
        afterAllEchoes();
      }
    }, 950);
  }, 950);
}

function afterAllEchoes(){
  choicesEl.className = '';
  choicesEl.innerHTML = '';

  addP('你睁开眼。', 'nar');
  scrollBottom();

  setTimeout(function(){
    addP('手机在口袋里震动。', 'nar');
    scrollBottom();

    setTimeout(function(){
      addP('“死哪去了？回来吃饭！”', 'said');
      scrollBottom();

      setTimeout(function(){
        startPushLoop();
      }, 1400);
    }, 1000);
  }, 1000);
}

/* =========================================================
   第五幕 · 循环二：压抑循环
   ========================================================= */

/* 光标拖尾 */
document.addEventListener('mousemove', function(e){
  if (!state.trailEnabled) return;
  const now = Date.now();
  if (now - state.lastTrailTime < 55) return;
  state.lastTrailTime = now;

  const dot = document.createElement('div');
  dot.className = 'trail-dot';
  dot.style.left = e.clientX + 'px';
  dot.style.top  = e.clientY + 'px';
  document.body.appendChild(dot);

  requestAnimationFrame(function(){ dot.style.opacity = '0'; });
  setTimeout(function(){ dot.remove(); }, 1400);
});

/* 暗角随点击次数收拢 */
function updateVignette(){
  const t = state.pushCount / 10;
  const blur   = 70  + t * 400;
  const spread = 0   + t * 110;
  const alpha  = 0.42 + t * 0.52;
  vignetteEl.style.boxShadow =
    'inset 0 0 ' + blur + 'px ' + spread + 'px rgba(0,0,0,' + alpha + ')';
}

/* 中央后退按钮随点击缩小 */
function shrinkBackButton(btn){
  const t = (state.pushCount - 1) / 9;
  const clampedT = Math.max(0, Math.min(1, t));

  const minW = 170 - clampedT * 54;
  const padY = 16  - clampedT * 6;
  const padX = 28  - clampedT * 13;
  const fs   = 16  - clampedT * 3.5;
  const ls   = 6   - clampedT * 5;

  btn.style.minWidth      = minW + 'px';
  btn.style.padding       = padY + 'px ' + padX + 'px';
  btn.style.fontSize      = fs + 'px';
  btn.style.letterSpacing = ls + 'px';
}

/* 进入压抑循环 */
function startPushLoop(){
  choicesEl.className = 'stage';
  choicesEl.innerHTML = '';
  state.pushCount = 0;

  breathEl.classList.add('on');
  state.trailEnabled = true;
  updateVignette();

  const backBtn = document.createElement('button');
  backBtn.className = 'choice center-back';
  backBtn.textContent = '后退一步';
  backBtn.style.minWidth      = '170px';
  backBtn.style.padding       = '16px 28px';
  backBtn.style.fontSize      = '16px';
  backBtn.style.letterSpacing = '6px';
  backBtn.addEventListener('click', function(){
    onCenterBackClick(backBtn);
  });
  choicesEl.appendChild(backBtn);
}

/* 中央后退按钮点击 —— 每次生成三个“前进一步” */
function onCenterBackClick(backBtn){
  if (state.pushCount >= 10) return;
  state.pushCount++;

  updateVignette();
  shrinkBackButton(backBtn);

  spawnForwardButton();
  spawnForwardButton();
  spawnForwardButton();

  if (state.pushCount >= 10){
    backBtn.disabled = true;
    setTimeout(doFlash, 520);
  }
}

/* 在随机位置生成一个“前进一步”，避免与已有元素重叠 */
function spawnForwardButton(){
  const btn = document.createElement('button');
  btn.className = 'choice spawn-forward';
  btn.textContent = '';

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const bw = 108;
  const bh = 38;
  const margin = 14;

  const blockers = [];
  const centerBtn = choicesEl.querySelector('.center-back');
  if (centerBtn) blockers.push(centerBtn.getBoundingClientRect());
  choicesEl.querySelectorAll('.spawn-forward').forEach(function(el){
    blockers.push(el.getBoundingClientRect());
  });

  const GAP = 12;
  let x = 0, y = 0, tries = 0, ok = false;

  while (!ok && tries < 100){
    tries++;
    x = margin + Math.random() * Math.max(10, vw - bw - margin * 2);
    y = margin + Math.random() * Math.max(10, vh - bh - margin * 2);

    const rect = { left: x, top: y, right: x + bw, bottom: y + bh };
    ok = true;

    for (let i = 0; i < blockers.length; i++){
      const b = blockers[i];
      const noOverlap =
        (rect.right  + GAP < b.left) ||
        (rect.left   - GAP > b.right) ||
        (rect.bottom + GAP < b.top) ||
        (rect.top    - GAP > b.bottom);
      if (!noOverlap){ ok = false; break; }
    }
  }

  btn.style.left = x + 'px';
  btn.style.top  = y + 'px';
  choicesEl.appendChild(btn);

  setTimeout(function(){
    btn.classList.add('shown');
    btn.textContent = '前进一步';
  }, 800);
}

/* 闪回 */
function doFlash(){
  state.trailEnabled = false;
  document.querySelectorAll('.trail-dot').forEach(function(d){ d.remove(); });

  choicesEl.innerHTML = '';

  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0';

  let n = 0;
  const total = 7;

  function tick(){
    n++;
    if (n > total){
      flashEl.style.transition = 'opacity .7s ease';
      flashEl.style.opacity = '0';
      setTimeout(showFinalForward, 760);
      return;
    }
    flashEl.style.transition = 'none';
    flashEl.style.opacity = (n % 2 === 1) ? '0.94' : '0';
    setTimeout(tick, 55 + Math.random() * 130);
  }

  setTimeout(tick, 80);
}

/* 闪回后 —— 只剩下一个巨大的“前进一步” */
function showFinalForward(){
  breathEl.classList.remove('on');
  vignetteEl.style.boxShadow = 'inset 0 0 0 0 transparent';

  choicesEl.className = 'final-stage';
  choicesEl.innerHTML = '';

  const btn = document.createElement('button');
  btn.className = 'choice final-forward';
  btn.textContent = '前进一步';
  btn.addEventListener('click', goEnding);
  choicesEl.appendChild(btn);
}

/* =========================================================
   坠落
   ========================================================= */
function goEnding(){
  choicesEl.className = '';
  choicesEl.innerHTML = '';

  addP('你向前迈出一步。', 'nar');
  scrollBottom();

  setTimeout(function(){
    addP('风从耳边呼啸而过。', 'nar');
    scrollBottom();

    setTimeout(function(){
      fadeEl.style.transition = 'opacity 2.6s ease';
      fadeEl.classList.add('on');

      /* 坠落时音乐淡出 */
      fadeOutBGM(2600);

      setTimeout(function(){
        logEl.innerHTML = '';
        choicesEl.className = '';
        choicesEl.innerHTML = '';
        logEl.scrollTop = 0;

        epilogue();

        fadeEl.style.transition = 'opacity 1.4s ease';
        fadeEl.classList.remove('on');
      }, 2700);

    }, 2300);
  }, 1300);
}

/* =========================================================
   尾声
   ========================================================= */
function epilogue(){
  const items = [
    ['nar',  '葬礼在一个阴雨天举行。'],
    ['nar',  '亲戚们撑着黑伞，小声议论着。'],
    ['said', '“现在的孩子心理太脆弱了。”大伯摇头。'],
    ['said', '“就是，一点挫折都受不了。我们当年挨打挨骂，不都活得好好的？”'],
    ['nar',  '母亲哭得几乎晕厥，父亲一脸木然。'],
    ['said', '“我们对他那么好……”母亲对着镜头哭诉，“他怎么能这么自私？”'],
    ['nar',  '高中群里。'],
    ['said', '“听说了吗？废物跳楼了。”'],
    ['said', '“哪个废物啊？”'],
    ['said', '“还能是哪个，陈默啊。”'],
    ['said', '“果然废物就是废物，活着也是浪费空气。”'],
    ['nar',  '他的房间被清理干净，变成了储物间，堆满了杂物。'],
    ['nar',  '没有人再提起他的名字。'],
    ['nar',  '陈默用死亡证明了一件事——'],
    ['final','他们从始至终都是对的。']
  ];

  let i = 0;

  function tick(){
    if (i >= items.length){
      setTimeout(function(){
        const end = document.createElement('div');
        end.className = 'the-end';
        end.textContent = '剧 终';
        logEl.appendChild(end);
        scrollBottom();
      }, 1800);
      return;
    }

    const it = items[i];
    addP(it[1], it[0]);
    scrollBottom();
    i++;

    const delay = (it[0] === 'final') ? 3200 : 1500;
    setTimeout(tick, delay);
  }

  tick();
}

/* =========================================================
   背景音乐控制
   ========================================================= */
function startBGM(){
  if (!bgmEl) return;
  bgmEl.volume = 0;
  var playPromise = bgmEl.play();
  if (playPromise && playPromise.catch){
    playPromise.catch(function(err){
      console.warn('音乐播放失败：', err);
    });
  }
  /* 淡入到 0.4 音量 */
  var v = 0;
  var fade = setInterval(function(){
    v += 0.02;
    if (v >= 0.6){ v = 0.6; clearInterval(fade); }
    bgmEl.volume = v;
  }, 60);
}

function fadeOutBGM(duration){
  if (!bgmEl) return;
  var startVol = bgmEl.volume;
  var steps = 40;
  var interval = duration / steps;
  var i = 0;
  var timer = setInterval(function(){
    i++;
    var v = startVol * (1 - i / steps);
    if (v <= 0){
      v = 0;
      clearInterval(timer);
      bgmEl.pause();
    }
    bgmEl.volume = v;
  }, interval);
}

/* =========================================================
   启动
   ========================================================= */
document.getElementById('startBtn').addEventListener('click', function(){
  /* ★ 点击开始 → 播放背景音乐 */
  startBGM();

  document.getElementById('cover').classList.add('hide');
  setTimeout(function(){
    document.getElementById('cover').style.display = 'none';
    nextBlock();
  }, 1400);
});
</script>
